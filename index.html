<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DogPark - Home</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <main class="page">
    <div id="navbar-placeholder"></div>

    <section class="home-hero">
      <img src="images/homedog1.png" alt="Dogs in a park">
      <a class="join-btn" href="html/parks.html">Join Us</a>
    </section>

    <section class="home-cards content-shell">
      <div class="row justify-content-center g-5">
        <div class="col-12 col-md-4">
          <div class="feature-card card-safety">
            <img src="images/homesafety.png" alt="Safety measures">
            <h5>Safety Measures</h5>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <a href="html/parks.html" style="text-decoration: none; color: inherit;">
            <div class="feature-card card-parks">
              <img src="images/homesocial.png" alt="Dog parks">
              <h5>Dog Parks</h5>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-4">
          <a href="html/events.html" style="text-decoration: none; color: inherit;">
            <div class="feature-card card-events">
              <img src="images/homeevents.png" alt="Events">
              <h5>Events</h5>
            </div>
          </a>
        </div>
      </div>
    </section>


    <div id="footer-placeholder"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/partials.js"></script>
</body>
</html>
