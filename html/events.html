<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DogPark - Events V2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/footer.css"><link rel="stylesheet" href="../css/listing.css"><link rel="stylesheet" href="../css/events.css">
</head>
<body>
  <main class="page">
    <div id="navbar-placeholder"></div>

    <section class="content-shell">
      <div class="row g-4">
        <div class="col-md-4">
          <select class="small-select mb-3"><option>Event</option><option>Training</option><option>Meetup</option></select>
          <div class="row g-2">
            <div class="col-6"><div class="mini-card position-relative"><span class="event-badge">Today</span><img src="https://images.unsplash.com/photo-1601758177266-bc599de87707?auto=format&fit=crop&w=400&q=80"><div class="p">Dog training</div></div></div>
            <div class="col-6"><div class="mini-card position-relative"><span class="event-badge">Free</span><img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=400&q=80"><div class="p">Park meetup</div></div></div>
            <div class="col-6"><div class="mini-card position-relative"><span class="event-badge">Sat</span><img src="https://images.unsplash.com/photo-1507146426996-ef05306b995a?auto=format&fit=crop&w=400&q=80"><div class="p">Adoption day</div></div></div>
            <div class="col-6"><div class="mini-card position-relative"><span class="event-badge">Sun</span><img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=400&q=80"><div class="p">Puppy race</div></div></div>
          </div>
          <p class="event-note">Select an event to see details on the map.</p>
        </div>
        <div class="col-md-8"><div class="map-panel"><img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1000&q=80"><i class="bi bi-geo-alt-fill map-pin"></i></div></div>
      </div>
      <div class="d-flex align-items-center justify-content-between pager"><button class="btn-soft">Filter</button><span>1 / 4</span><button class="btn-soft">User reviews</button></div>
    </section>

    <div id="footer-placeholder"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/partials.js"></script>
</body>
</html>
