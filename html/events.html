<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DogPark - Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/parks.css">
  <link rel="stylesheet" href="../css/events.css">
</head>
<body>
  <main class="page">
    <div id="navbar-placeholder"></div>

    <section class="page-hero events-hero">
      <img src="../images/homeevents.png" alt="Dogs attending a community event">
      <div class="page-hero-copy">
        <p class="section-subtitle">Community calendar</p>
        <h1>Events</h1>
        <p>Find training classes, meetups, adoption days and playful activities for dogs and their owners.</p>
      </div>
    </section>

    <section class="content-shell">
      <div class="row g-4">
        <div class="col-md-4 d-flex flex-column gap-3">
          <div class="search-wrapper">
            <i class="bi bi-search search-icon"></i>
            <input class="search-box" placeholder="Search an event…">
          </div>

          <div class="row g-3">
            <div class="col-6">
              <a href="event-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=1200&q=80" alt="Dog training">
                  <div class="park-card-body">
                    <div class="park-card-name">Dog Training Class</div>
                    <div class="park-card-city"><i class="bi bi-calendar-event-fill"></i> Today · London</div>
                  </div>
                </div>
              </a>
            </div>
            
            <div class="col-6">
              <a href="event-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=400&q=80" alt="Park meetup">
                  <div class="park-card-body">
                    <div class="park-card-name">Park Meetup</div>
                    <div class="park-card-city"><i class="bi bi-calendar-event-fill"></i> Sat · Madrid</div>
                  </div>
                </div>
              </a>
            </div>
            <div class="col-6">
              <a href="event-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1507146426996-ef05306b995a?auto=format&fit=crop&w=400&q=80" alt="Adoption day">
                  <div class="park-card-body">
                    <div class="park-card-name">Adoption Day</div>
                    <div class="park-card-city"><i class="bi bi-calendar-event-fill"></i> Sun · Paris</div>
                  </div>
                </div>
              </a>
            </div>
            <div class="col-6">
              <a href="event-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=400&q=80" alt="Puppy race">
                  <div class="park-card-body">
                    <div class="park-card-name">Puppy Race</div>
                    <div class="park-card-city"><i class="bi bi-calendar-event-fill"></i> Mon · Zagreb</div>
                  </div>
                </div>
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="map-panel">
            <iframe
              src="https://www.google.com/maps?q=Dog+Park&output=embed"
              allowfullscreen loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>
        </div>
      </div>

      <div class="filters-bar">
        <div class="dropdown">
          <button class="filter-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-sliders2"></i> Filter
          </button>
          <div class="dropdown-menu filter-dropdown p-3">
            <div class="filter-section-label">Event type</div>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-mortarboard"></i> Training</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-people-fill"></i> Meetup</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-heart-fill"></i> Adoption</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-trophy-fill"></i> Competition</label>
            </div>
            <div class="filter-section-label">Date</div>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-calendar-day"></i> Today</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-calendar-week"></i> This week</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-calendar-month"></i> This month</label>
            </div>
            <div class="filter-section-label">Price</div>
            <div class="d-flex flex-wrap gap-2">
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-gift"></i> Free</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-cash"></i> Paid</label>
            </div>
          </div>
        </div>

        <div class="filters-divider"></div>

        <div class="quick-chips">
          <button class="quick-chip active-chip">All</button>
          <button class="quick-chip"><i class="bi bi-calendar-day"></i> Today</button>
          <button class="quick-chip"><i class="bi bi-mortarboard"></i> Training</button>
          <button class="quick-chip"><i class="bi bi-gift"></i> Free</button>
          <button class="quick-chip"><i class="bi bi-trophy-fill"></i> Competition</button>
        </div>

        <div class="filters-divider"></div>

        <div class="reviews-mini">
          <span class="reviews-mini-label">Min. rating</span>
          <div class="d-flex align-items-center gap-2">
            <span class="reviews-bound">0</span>
            <input type="range" min="0" max="5" step="1" value="0" class="reviews-slider">
            <span class="reviews-bound">5</span>
          </div>
        </div>

        <div class="ms-auto results-badge">
          <i class="bi bi-calendar-event"></i> 4 events
        </div>
      </div>

    </section>

    <div id="footer-placeholder"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/partials.js"></script>
</body>
</html>
