<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DogPark - Parks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/listing.css">
</head>
<body>
  <main class="page">
    <div id="navbar-placeholder"></div>

    <section class="content-shell">
      <div class="row g-4">

        <div class="col-md-4 d-flex flex-column gap-3">
          <div class="search-wrapper">
            <i class="bi bi-search search-icon"></i>
            <input class="search-box" placeholder="Search a park…">
          </div>

          <div class="row g-3">
            <div class="col-6">
              <a href="park-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=400&q=80" alt="Greenwood">
                  <div class="park-card-body">
                    <div class="park-card-name">Greenwood Dog Park</div>
                    <div class="park-card-city"><i class="bi bi-geo-alt-fill"></i> London</div>
                  </div>
                </div>
              </a>
            </div>
            <div class="col-6">
              <a href="park-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=400&q=80" alt="Los Perros">
                  <div class="park-card-body">
                    <div class="park-card-name">Los Perros Dog Park</div>
                    <div class="park-card-city"><i class="bi bi-geo-alt-fill"></i> Madrid</div>
                  </div>
                </div>
              </a>
            </div>
            <div class="col-6">
              <a href="park-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=400&q=80" alt="Les Chiens">
                  <div class="park-card-body">
                    <div class="park-card-name">Les Chiens Dog Park</div>
                    <div class="park-card-city"><i class="bi bi-geo-alt-fill"></i> Paris</div>
                  </div>
                </div>
              </a>
            </div>
            <div class="col-6">
              <a href="park-info.html" class="text-decoration-none text-dark">
                <div class="park-card">
                  <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?auto=format&fit=crop&w=400&q=80" alt="Pas Dog Park">
                  <div class="park-card-body">
                    <div class="park-card-name">Pas Dog Park</div>
                    <div class="park-card-city"><i class="bi bi-geo-alt-fill"></i> Zagreb</div>
                  </div>
                </div>
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="map-panel">
            <iframe
              src="https://www.google.com/maps?q=Dog+Park&output=embed"
              allowfullscreen loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>
        </div>
      </div>

      <!-- Filters bar -->
      <div class="filters-bar">

        <!-- Dropdown Filter -->
        <div class="dropdown">
          <button class="filter-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-sliders2"></i> Filter
          </button>
          <div class="dropdown-menu filter-dropdown p-3">
            <div class="filter-section-label">Park size</div>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-circle"></i> Small</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-circle-half"></i> Medium</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-circle-fill"></i> Large</label>
            </div>
            <div class="filter-section-label">Amenities</div>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-droplet-fill"></i> Water</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-p-square-fill"></i> Parking</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-journal-bookmark"></i> Benches</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-lightbulb-fill"></i> Lighting</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-shield-check"></i> Fenced</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-trash3"></i> Waste bags</label>
            </div>
            <div class="filter-section-label">Dog size allowed</div>
            <div class="d-flex flex-wrap gap-2">
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-heart"></i> Small dogs</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-heart-fill"></i> Large dogs</label>
              <label class="filter-chip"><input type="checkbox"> <i class="bi bi-check2-circle"></i> All sizes</label>
            </div>
          </div>
        </div>

        <div class="filters-divider"></div>

        <!-- Quick chips -->
        <div class="quick-chips">
          <button class="quick-chip active-chip">All</button>
          <button class="quick-chip"><i class="bi bi-clock"></i> Open now</button>
          <button class="quick-chip"><i class="bi bi-circle-fill"></i> Large</button>
          <button class="quick-chip"><i class="bi bi-droplet-fill"></i> Water</button>
          <button class="quick-chip"><i class="bi bi-shield-check"></i> Fenced</button>
        </div>

        <div class="filters-divider"></div>

        <!-- Mini reviews slider -->
        <div class="reviews-mini">
          <span class="reviews-mini-label">Min. rating</span>
          <div class="d-flex align-items-center gap-2">
            <span class="reviews-bound">0</span>
            <input type="range" min="0" max="5" step="1" value="0" class="reviews-slider">
            <span class="reviews-bound">5</span>
          </div>
        </div>

        <!-- Results badge -->
        <div class="ms-auto results-badge">
          <i class="bi bi-geo-alt"></i> 4 parks
        </div>

      </div>

    </section>

    <div id="footer-placeholder"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/partials.js"></script>
</body>
</html>
